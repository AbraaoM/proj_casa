<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <title>Casa</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fafafa;
        color: #000;
        font-family: system-ui, sans-serif;
      }
      main { max-width: 22rem; padding: 2rem; }
      h1 { margin: 1rem 0 0; font-size: 3rem; line-height: 1; letter-spacing: -0.02em; }
      p { margin: 0.75rem 0 0; color: #6b7280; line-height: 1.4; }
      a { color: inherit; }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #fff; }
        p { color: #9ca3af; }
      }
    </style>
  </head>
  <body>
    <main>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
        <path d="M32 4 L60 26 L54 60 L10 60 L4 26 Z" fill="#10b981" stroke="#047857" stroke-width="3" stroke-linejoin="round"/>
        <path d="M26 60 V46 a6 6 0 0 1 12 0 V60 Z" fill="#fafafa"/>
      </svg>
      <h1>Casa</h1>
      <p>Sem conexão agora. Abra de novo quando a rede voltar.</p>
      <p><a href="/">Tentar outra vez</a></p>
    </main>
  </body>
</html>
